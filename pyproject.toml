[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wgc-download"
version = "0.2.0"
description = "Download and extract Wargaming game files (WoWS, WoT, WoTB, WoWP) from the WGC API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "py7zr>=1.0",
]

[project.scripts]
wgc-download = "wgc_download.cli:main"

[project.urls]
Homepage = "https://github.com/Monstrofil/wgc-download"

[tool.setuptools.packages.find]
where = ["src"]
